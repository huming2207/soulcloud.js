name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: soulcloud
          POSTGRES_USER: soulcloud
          POSTGRES_PASSWORD: soulcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soulcloud -d soulcloud"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://soulcloud:soulcloud@127.0.0.1:5432/soulcloud
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations
        run: bun run db:deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bash scripts/test.sh
        env:
          TEST_DATABASE_URL: postgres://soulcloud:soulcloud@127.0.0.1:5432/soulcloud_test

      - name: E2E (both processes)
        run: bash scripts/run-e2e.sh
        env:
          # CI-only value; a real deployment must set its own (fail-fast)
          JWT_SECRET: ci-e2e-jwt-secret-0123456789-0123456789

      # ELF-dependent demo integration tests skip when the demo ELF is
      # absent (it is regenerated locally with scripts/build-on9log-fixtures.sh)
