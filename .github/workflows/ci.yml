name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests + E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: soulcloud
          POSTGRES_USER: soulcloud
          POSTGRES_PASSWORD: soulcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soulcloud -d soulcloud"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://soulcloud:soulcloud@127.0.0.1:5432/soulcloud
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Validate workflow syntax (actionlint)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C /tmp actionlint
          /tmp/actionlint .github/workflows/ci.yml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Preflight database connectivity
        run: |
          echo "DATABASE_URL=$DATABASE_URL"
          ok=0
          for i in $(seq 1 15); do
            if (timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/5432') 2>/dev/null; then
              echo "port 5432 reachable (attempt $i)"; ok=1; break
            fi
            echo "waiting for postgres (attempt $i)..."; sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::port 5432 never became reachable"; exit 1; }

      - name: Apply migrations
        run: bun run db:deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Test (isolated test database)
        run: bash scripts/test.sh
        env:
          TEST_DATABASE_URL: postgres://soulcloud:soulcloud@127.0.0.1:5432/soulcloud_test

      - name: E2E (both processes)
        run: bash scripts/run-e2e.sh
        env:
          # CI-only value; a real deployment must set its own (fail-fast)
          JWT_SECRET: ci-e2e-jwt-secret-0123456789-0123456789

  web:
    name: Web (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Web typecheck
        run: bun run --cwd packages/web typecheck

      - name: Web lint
        run: bun run --cwd packages/web lint

      - name: Web i18n static scan (hardcoded CJK)
        run: bash scripts/scan-hardcoded-i18n.sh

      - name: Web unit tests
        run: bun run --cwd packages/web test -- --timeout 30000

      - name: Web build
        run: bun run --cwd packages/web build

  web-e2e:
    name: Web <-> API E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: soulcloud
          POSTGRES_USER: soulcloud
          POSTGRES_PASSWORD: soulcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soulcloud -d soulcloud"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://soulcloud:soulcloud@127.0.0.1:5432/soulcloud
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Preflight database connectivity
        run: |
          echo "DATABASE_URL=$DATABASE_URL"
          ok=0
          for i in $(seq 1 15); do
            if (timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/5432') 2>/dev/null; then
              echo "port 5432 reachable (attempt $i)"; ok=1; break
            fi
            echo "waiting for postgres (attempt $i)..."; sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::port 5432 never became reachable"; exit 1; }

      - name: Apply migrations
        run: bun run db:deploy

      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install || agent-browser install --with-deps

      - name: E2E (web <-> API)
        run: bash scripts/web-e2e-ci.sh
        env:
          JWT_SECRET: ci-web-e2e-jwt-secret-0123456789-0123456789

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-screenshots
          path: /tmp/soulcloud-web-screenshot/*.png
          if-no-files-found: ignore
