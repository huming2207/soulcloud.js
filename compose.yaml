name: soulcloudjs

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: soulcloud
      POSTGRES_USER: soulcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulcloud}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulcloud -d soulcloud"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql
      # fresh volumes also get the isolated test database
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

  soulinjector-plugin-postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: soulinjector
      POSTGRES_USER: soulinjector
      POSTGRES_PASSWORD: ${SOULINJECTOR_PLUGIN_POSTGRES_PASSWORD:-soulinjector}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulinjector -d soulinjector"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - soulinjector-plugin-postgres-data:/var/lib/postgresql
    networks:
      - soulcloud-plugin-private

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment:
      DATABASE_URL: postgres://soulcloud:${POSTGRES_PASSWORD:-soulcloud}@postgres:5432/soulcloud
      # shared with the broker; must be set in .env (>= 32 chars)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      API_BIND_ADDRESS: 0.0.0.0:8080
      PLUGIN_MANAGER_INTERNAL_URL: http://plugin-manager:8091
      PLUGIN_MANAGER_SERVICE_TOKEN: ${PLUGIN_MANAGER_SERVICE_TOKEN:?set PLUGIN_MANAGER_SERVICE_TOKEN in .env}
      PLUGIN_MANAGER_REQUEST_TIMEOUT_MS: ${PLUGIN_MANAGER_REQUEST_TIMEOUT_MS:-5000}
      PLUGIN_MANAGER_UPLOAD_TIMEOUT_MS: ${PLUGIN_MANAGER_UPLOAD_TIMEOUT_MS:-600000}
      PLUGIN_MANAGER_UI_SESSION_SECRET: ${PLUGIN_MANAGER_UI_SESSION_SECRET:?set PLUGIN_MANAGER_UI_SESSION_SECRET in .env}
      PLUGIN_UI_ORIGIN: ${PLUGIN_UI_ORIGIN:-https://plugins.example.com}
      PLUGIN_UI_SESSION_TTL_SECONDS: ${PLUGIN_UI_SESSION_TTL_SECONDS:-300}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: broker
    environment:
      DATABASE_URL: postgres://soulcloud:${POSTGRES_PASSWORD:-soulcloud}@postgres:5432/soulcloud
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MQTT_BROKER_PORT: 1883
    ports:
      # loopback only: plaintext MQTT must not be reachable from other
      # hosts (WEB-04). The reverse proxy reaches the broker over the
      # docker network; production removes this mapping entirely (see
      # deploy/traefik/compose.prod.yaml).
      - "127.0.0.1:1883:1883"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # MQTT over WS has no HTTP endpoint; probe the TCP listener directly
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1883"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  plugin-manager:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: plugin-manager
    environment:
      DATABASE_URL: postgres://soulcloud:${POSTGRES_PASSWORD:-soulcloud}@postgres:5432/soulcloud
      PLUGIN_ENDPOINTS: ${PLUGIN_ENDPOINTS:-soulcloud.soulinjector-debugger=ws://soulinjector-plugin:8090/rpc/ws}
      PLUGIN_MANAGER_INTERNAL_BIND: 0.0.0.0
      PLUGIN_MANAGER_INTERNAL_PORT: 8091
      PLUGIN_MANAGER_SERVICE_TOKEN: ${PLUGIN_MANAGER_SERVICE_TOKEN:?set PLUGIN_MANAGER_SERVICE_TOKEN in .env}
      PLUGIN_RPC_AUTH_TOKEN: ${PLUGIN_RPC_AUTH_TOKEN:?set PLUGIN_RPC_AUTH_TOKEN in .env}
      PLUGIN_MANAGER_UI_SESSION_SECRET: ${PLUGIN_MANAGER_UI_SESSION_SECRET:?set PLUGIN_MANAGER_UI_SESSION_SECRET in .env}
      PLUGIN_UI_SESSION_TTL_SECONDS: ${PLUGIN_UI_SESSION_TTL_SECONDS:-300}
      PLUGIN_RPC_MAX_REVERSE_CALLS: ${PLUGIN_RPC_MAX_REVERSE_CALLS:-64}
      PLUGIN_RPC_MAX_PLUGIN_CALL_DEPTH: ${PLUGIN_RPC_MAX_PLUGIN_CALL_DEPTH:-4}
      PLUGIN_RPC_MAX_REVERSE_CONCURRENCY: ${PLUGIN_RPC_MAX_REVERSE_CONCURRENCY:-256}
      PLUGIN_RPC_MAX_REVERSE_CONCURRENCY_PER_PLUGIN: ${PLUGIN_RPC_MAX_REVERSE_CONCURRENCY_PER_PLUGIN:-64}
      PLUGIN_RPC_MAX_REVERSE_CONCURRENCY_PER_INSTALLATION: ${PLUGIN_RPC_MAX_REVERSE_CONCURRENCY_PER_INSTALLATION:-16}
      PLUGIN_RPC_MAX_STAGED_COMMANDS: ${PLUGIN_RPC_MAX_STAGED_COMMANDS:-32}
      PLUGIN_RPC_MAX_STAGED_COMMAND_BYTES: ${PLUGIN_RPC_MAX_STAGED_COMMAND_BYTES:-262144}
      PLUGIN_RPC_MAX_FRAME_BYTES: ${PLUGIN_RPC_MAX_FRAME_BYTES:-1048576}
      PLUGIN_RPC_MAX_VALUE_DEPTH: ${PLUGIN_RPC_MAX_VALUE_DEPTH:-32}
      PLUGIN_RPC_MAX_VALUE_NODES: ${PLUGIN_RPC_MAX_VALUE_NODES:-4096}
      PLUGIN_RPC_MAX_ARRAY_ITEMS: ${PLUGIN_RPC_MAX_ARRAY_ITEMS:-4096}
      PLUGIN_RPC_MAX_STRING_BYTES: ${PLUGIN_RPC_MAX_STRING_BYTES:-524288}
      PLUGIN_RPC_MAX_BLOBS: ${PLUGIN_RPC_MAX_BLOBS:-16}
      PLUGIN_RPC_MAX_BLOB_BYTES: ${PLUGIN_RPC_MAX_BLOB_BYTES:-65536}
      PLUGIN_RPC_MAX_TOTAL_BLOB_BYTES: ${PLUGIN_RPC_MAX_TOTAL_BLOB_BYTES:-262144}
      PLUGIN_RPC_MAX_PENDING_REQUESTS: ${PLUGIN_RPC_MAX_PENDING_REQUESTS:-128}
      PLUGIN_MANAGER_MAX_OPERATIONS: ${PLUGIN_MANAGER_MAX_OPERATIONS:-256}
      PLUGIN_MANAGER_MAX_OPERATIONS_PER_PLUGIN: ${PLUGIN_MANAGER_MAX_OPERATIONS_PER_PLUGIN:-64}
      PLUGIN_MANAGER_MAX_OPERATIONS_PER_INSTALLATION: ${PLUGIN_MANAGER_MAX_OPERATIONS_PER_INSTALLATION:-32}
      PLUGIN_RPC_BACKPRESSURE_BYTES: ${PLUGIN_RPC_BACKPRESSURE_BYTES:-4194304}
      PLUGIN_RPC_HEARTBEAT_INTERVAL_MS: ${PLUGIN_RPC_HEARTBEAT_INTERVAL_MS:-15000}
      PLUGIN_RPC_HEARTBEAT_TIMEOUT_MS: ${PLUGIN_RPC_HEARTBEAT_TIMEOUT_MS:-3000}
      PLUGIN_RPC_CONNECT_TIMEOUT_MS: ${PLUGIN_RPC_CONNECT_TIMEOUT_MS:-10000}
      PLUGIN_MANAGER_RECONNECT_MS: ${PLUGIN_MANAGER_RECONNECT_MS:-2000}
      PLUGIN_EVENT_POLL_INTERVAL_MS: ${PLUGIN_EVENT_POLL_INTERVAL_MS:-500}
      PLUGIN_EVENT_LEASE_MS: ${PLUGIN_EVENT_LEASE_MS:-60000}
      PLUGIN_EVENT_BATCH_SIZE: ${PLUGIN_EVENT_BATCH_SIZE:-32}
      PLUGIN_EVENT_MAX_CONCURRENCY: ${PLUGIN_EVENT_MAX_CONCURRENCY:-4}
      PLUGIN_EVENT_TIMEOUT_MS: ${PLUGIN_EVENT_TIMEOUT_MS:-30000}
      PLUGIN_EVENT_MAX_ATTEMPTS: ${PLUGIN_EVENT_MAX_ATTEMPTS:-5}
      PLUGIN_EVENT_RETENTION_DAYS: ${PLUGIN_EVENT_RETENTION_DAYS:-30}
      PLUGIN_ENTITY_HISTORY_RETENTION_DAYS: ${PLUGIN_ENTITY_HISTORY_RETENTION_DAYS:-30}
      PLUGIN_MAINTENANCE_INTERVAL_MS: ${PLUGIN_MAINTENANCE_INTERVAL_MS:-3600000}
      PLUGIN_RETENTION_BATCH_SIZE: ${PLUGIN_RETENTION_BATCH_SIZE:-2000}
      PLUGIN_RETENTION_MAX_BATCHES: ${PLUGIN_RETENTION_MAX_BATCHES:-8}
      PLUGIN_ARTIFACT_MAX_BYTES: ${PLUGIN_ARTIFACT_MAX_BYTES:-67108864}
      PLUGIN_ARTIFACT_UPLOAD_TIMEOUT_MS: ${PLUGIN_ARTIFACT_UPLOAD_TIMEOUT_MS:-600000}
    ports:
      - "127.0.0.1:8091:8091"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      soulinjector-plugin:
        condition: service_started
    networks:
      - default
      - soulcloud-plugin-rpc
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  soulinjector-plugin:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: soulinjector-plugin
    environment:
      SOULINJECTOR_PLUGIN_DATABASE_URL: postgres://soulinjector:${SOULINJECTOR_PLUGIN_POSTGRES_PASSWORD:-soulinjector}@soulinjector-plugin-postgres:5432/soulinjector
      SOULINJECTOR_PLUGIN_DB_POOL_SIZE: ${SOULINJECTOR_PLUGIN_DB_POOL_SIZE:-4}
      SOULINJECTOR_PLUGIN_UPLOAD_CLEANUP_INTERVAL_MS: ${SOULINJECTOR_PLUGIN_UPLOAD_CLEANUP_INTERVAL_MS:-300000}
      SOULINJECTOR_PLUGIN_UPLOAD_CLEANUP_BATCH_SIZE: ${SOULINJECTOR_PLUGIN_UPLOAD_CLEANUP_BATCH_SIZE:-256}
      PLUGIN_BIND: 0.0.0.0
      PLUGIN_PORT: 8090
      PLUGIN_RPC_AUTH_TOKEN: ${PLUGIN_RPC_AUTH_TOKEN:?set PLUGIN_RPC_AUTH_TOKEN in .env}
      PLUGIN_RPC_MAX_FRAME_BYTES: ${PLUGIN_RPC_MAX_FRAME_BYTES:-1048576}
      PLUGIN_RPC_MAX_OPERATIONS: ${PLUGIN_RPC_MAX_OPERATIONS:-8}
      PLUGIN_RPC_BACKPRESSURE_BYTES: ${PLUGIN_RPC_BACKPRESSURE_BYTES:-4194304}
      PLUGIN_RPC_IDLE_TIMEOUT_SECONDS: ${PLUGIN_RPC_IDLE_TIMEOUT_SECONDS:-60}
      PLUGIN_RPC_MAX_VALUE_DEPTH: ${PLUGIN_RPC_MAX_VALUE_DEPTH:-32}
      PLUGIN_RPC_MAX_VALUE_NODES: ${PLUGIN_RPC_MAX_VALUE_NODES:-4096}
      PLUGIN_RPC_MAX_ARRAY_ITEMS: ${PLUGIN_RPC_MAX_ARRAY_ITEMS:-4096}
      PLUGIN_RPC_MAX_STRING_BYTES: ${PLUGIN_RPC_MAX_STRING_BYTES:-524288}
      PLUGIN_RPC_MAX_BLOBS: ${PLUGIN_RPC_MAX_BLOBS:-16}
      PLUGIN_RPC_MAX_BLOB_BYTES: ${PLUGIN_RPC_MAX_BLOB_BYTES:-65536}
      PLUGIN_RPC_MAX_TOTAL_BLOB_BYTES: ${PLUGIN_RPC_MAX_TOTAL_BLOB_BYTES:-262144}
    # Keep plugin faults contained at the deployment boundary.  These limits
    # are deliberately configurable because the artifact/debug workload varies
    # by deployment, but the defaults prevent an accidental plugin allocation
    # or process fan-out from competing unboundedly with the core services.
    mem_limit: ${SOULINJECTOR_PLUGIN_MEMORY_LIMIT:-512m}
    cpus: ${SOULINJECTOR_PLUGIN_CPU_LIMIT:-1.0}
    pids_limit: ${SOULINJECTOR_PLUGIN_PIDS_LIMIT:-128}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      soulinjector-plugin-postgres:
        condition: service_healthy
    networks:
      - soulcloud-plugin-rpc
      - soulcloud-plugin-private
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health | grep -q soulcloud.soulinjector-debugger"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      # loopback only; the reverse proxy terminates TLS and routes
      # host/ to this service over the docker network
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  soulinjector-plugin-postgres-data:

networks:
  default:
  soulcloud-plugin-rpc:
  soulcloud-plugin-private:
