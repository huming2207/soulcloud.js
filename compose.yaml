name: soulcloudjs

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: soulcloud
      POSTGRES_USER: soulcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulcloud}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulcloud -d soulcloud"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql
      # fresh volumes also get the isolated test database
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment:
      DATABASE_URL: postgres://soulcloud:${POSTGRES_PASSWORD:-soulcloud}@postgres:5432/soulcloud
      # shared with the broker; must be set in .env (>= 32 chars)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      API_BIND_ADDRESS: 0.0.0.0:8080
      # action encoders run in plugin hosts via the dispatcher endpoint
      PLUGIN_DISPATCHER_URL: http://plugin-dispatcher:8091
      PLUGIN_DISPATCHER_AUTH_TOKEN: ${PLUGIN_DISPATCHER_AUTH_TOKEN:-soulcloud-dev-dispatcher-token}
      PLUGIN_ENCODE_TIMEOUT_MS: ${PLUGIN_ENCODE_TIMEOUT_MS:-5000}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  broker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: broker
    environment:
      DATABASE_URL: postgres://soulcloud:${POSTGRES_PASSWORD:-soulcloud}@postgres:5432/soulcloud
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MQTT_BROKER_PORT: 1883
    ports:
      # loopback only: plaintext MQTT must not be reachable from other
      # hosts (WEB-04). The reverse proxy reaches the broker over the
      # docker network; production removes this mapping entirely (see
      # deploy/traefik/compose.prod.yaml).
      - "127.0.0.1:1883:1883"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # MQTT over WS has no HTTP endpoint; probe the TCP listener directly
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1883"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - app

  plugin-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: plugin-dispatcher
    environment:
      DATABASE_URL: postgres://soulcloud:${POSTGRES_PASSWORD:-soulcloud}@postgres:5432/soulcloud
      PLUGIN_RPC_TRANSPORT: ${PLUGIN_RPC_TRANSPORT:-orpc-ws}
      PLUGIN_HOST_ENDPOINTS: ${PLUGIN_HOST_ENDPOINTS:-soulcloud.generic=ws://plugin-host-generic:8090/rpc/ws}
      # HTTP MessagePack fallback during migration; ignored when endpoints is set.
      PLUGIN_HOST_URLS: ${PLUGIN_HOST_URLS:-}
      # Override this development default in production/.env.
      PLUGIN_HOST_AUTH_TOKEN: ${PLUGIN_HOST_AUTH_TOKEN:-soulcloud-dev-plugin-token}
      # synchronous action-encoding endpoint used by the API
      PLUGIN_DISPATCHER_HTTP_PORT: 8091
      PLUGIN_DISPATCHER_HTTP_BIND: 0.0.0.0
      PLUGIN_DISPATCHER_AUTH_TOKEN: ${PLUGIN_DISPATCHER_AUTH_TOKEN:-soulcloud-dev-dispatcher-token}
      PLUGIN_ENCODE_TIMEOUT_MS: ${PLUGIN_ENCODE_TIMEOUT_MS:-5000}
      PLUGIN_RPC_MAX_FRAME_BYTES: ${PLUGIN_RPC_MAX_FRAME_BYTES:-1048576}
      PLUGIN_RPC_BACKPRESSURE_BYTES: ${PLUGIN_RPC_BACKPRESSURE_BYTES:-4194304}
      PLUGIN_RPC_MAX_PENDING_REQUESTS: ${PLUGIN_RPC_MAX_PENDING_REQUESTS:-128}
      PLUGIN_RPC_HEARTBEAT_INTERVAL_MS: ${PLUGIN_RPC_HEARTBEAT_INTERVAL_MS:-15000}
      PLUGIN_RPC_HEARTBEAT_TIMEOUT_MS: ${PLUGIN_RPC_HEARTBEAT_TIMEOUT_MS:-3000}
      PLUGIN_RPC_RECONNECT_BASE_MS: ${PLUGIN_RPC_RECONNECT_BASE_MS:-500}
      PLUGIN_RPC_RECONNECT_MAX_MS: ${PLUGIN_RPC_RECONNECT_MAX_MS:-30000}
      PLUGIN_RPC_MAX_OPERATIONS: ${PLUGIN_RPC_MAX_OPERATIONS:-64}
      PLUGIN_RPC_MAX_REVERSE_IN_FLIGHT: ${PLUGIN_RPC_MAX_REVERSE_IN_FLIGHT:-64}
      PLUGIN_RPC_PER_PLUGIN_REVERSE_IN_FLIGHT: ${PLUGIN_RPC_PER_PLUGIN_REVERSE_IN_FLIGHT:-16}
      PLUGIN_RPC_PER_INSTALLATION_REVERSE_IN_FLIGHT: ${PLUGIN_RPC_PER_INSTALLATION_REVERSE_IN_FLIGHT:-8}
      PLUGIN_RPC_PER_OPERATION_REVERSE_IN_FLIGHT: ${PLUGIN_RPC_PER_OPERATION_REVERSE_IN_FLIGHT:-4}
      PLUGIN_RPC_MAX_REVERSE_CALLS_PER_OPERATION: ${PLUGIN_RPC_MAX_REVERSE_CALLS_PER_OPERATION:-64}
      PLUGIN_RPC_MAX_STAGED_COMMANDS_PER_OPERATION: ${PLUGIN_RPC_MAX_STAGED_COMMANDS_PER_OPERATION:-16}
      PLUGIN_RPC_MAX_BLOBS: ${PLUGIN_RPC_MAX_BLOBS:-16}
      PLUGIN_RPC_MAX_BLOB_BYTES: ${PLUGIN_RPC_MAX_BLOB_BYTES:-65536}
      PLUGIN_RPC_MAX_TOTAL_BLOB_BYTES: ${PLUGIN_RPC_MAX_TOTAL_BLOB_BYTES:-262144}
      PLUGIN_RPC_MAX_DEPTH: ${PLUGIN_RPC_MAX_DEPTH:-32}
      PLUGIN_RPC_MAX_NODES: ${PLUGIN_RPC_MAX_NODES:-4096}
      PLUGIN_RPC_MAX_ARRAY_ITEMS: ${PLUGIN_RPC_MAX_ARRAY_ITEMS:-4096}
      PLUGIN_RPC_MAX_STRING_BYTES: ${PLUGIN_RPC_MAX_STRING_BYTES:-65536}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      plugin-host-generic:
        condition: service_healthy
    networks:
      - app
      - plugin_generic

  plugin-host-generic:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: plugin-host
    environment:
      PLUGIN_ID: soulcloud.generic
      PLUGIN_HOST_BIND: 0.0.0.0
      PLUGIN_HOST_PORT: 8090
      PLUGIN_HOST_AUTH_TOKEN: ${PLUGIN_HOST_AUTH_TOKEN:-soulcloud-dev-plugin-token}
      PLUGIN_HOST_MAX_FRAME_BYTES: ${PLUGIN_HOST_MAX_FRAME_BYTES:-1048576}
      PLUGIN_RPC_MAX_BLOBS: ${PLUGIN_RPC_MAX_BLOBS:-16}
      PLUGIN_RPC_MAX_BLOB_BYTES: ${PLUGIN_RPC_MAX_BLOB_BYTES:-65536}
      PLUGIN_RPC_MAX_TOTAL_BLOB_BYTES: ${PLUGIN_RPC_MAX_TOTAL_BLOB_BYTES:-262144}
      PLUGIN_RPC_MAX_DEPTH: ${PLUGIN_RPC_MAX_DEPTH:-32}
      PLUGIN_RPC_MAX_NODES: ${PLUGIN_RPC_MAX_NODES:-4096}
      PLUGIN_RPC_MAX_ARRAY_ITEMS: ${PLUGIN_RPC_MAX_ARRAY_ITEMS:-4096}
      PLUGIN_RPC_MAX_STRING_BYTES: ${PLUGIN_RPC_MAX_STRING_BYTES:-65536}
      PLUGIN_HOST_WS_BACKPRESSURE_BYTES: ${PLUGIN_HOST_WS_BACKPRESSURE_BYTES:-4194304}
      PLUGIN_HOST_WS_IDLE_TIMEOUT_SECONDS: ${PLUGIN_HOST_WS_IDLE_TIMEOUT_SECONDS:-60}
      PLUGIN_HOST_MAX_WS_CONNECTIONS: ${PLUGIN_HOST_MAX_WS_CONNECTIONS:-16}
      PLUGIN_HOST_HEALTH_INTERVAL_SECONDS: ${PLUGIN_HOST_HEALTH_INTERVAL_SECONDS:-5}
      PLUGIN_HOST_HEALTH_TIMEOUT_SECONDS: ${PLUGIN_HOST_HEALTH_TIMEOUT_SECONDS:-2}
      PLUGIN_HOST_HEALTH_FAILURES: ${PLUGIN_HOST_HEALTH_FAILURES:-3}
      PLUGIN_HOST_HEALTH_STARTUP_GRACE_SECONDS: ${PLUGIN_HOST_HEALTH_STARTUP_GRACE_SECONDS:-15}
      PLUGIN_HOST_RESTART_DELAY_SECONDS: ${PLUGIN_HOST_RESTART_DELAY_SECONDS:-1}
      PLUGIN_HOST_MAX_RESTARTS: ${PLUGIN_HOST_MAX_RESTARTS:-5}
      PLUGIN_HOST_RESTART_WINDOW_SECONDS: ${PLUGIN_HOST_RESTART_WINDOW_SECONDS:-60}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${PLUGIN_HOST_MEMORY_LIMIT:-512m}
    cpus: ${PLUGIN_HOST_CPU_LIMIT:-1.0}
    pids_limit: ${PLUGIN_HOST_PID_LIMIT:-128}
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8090/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: ${PLUGIN_HOST_HEALTH_INTERVAL_SECONDS:-5}s
      timeout: ${PLUGIN_HOST_HEALTH_TIMEOUT_SECONDS:-2}s
      retries: ${PLUGIN_HOST_HEALTH_FAILURES:-3}
      start_period: ${PLUGIN_HOST_HEALTH_STARTUP_GRACE_SECONDS:-15}s
    networks:
      - plugin_generic

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      # loopback only; the reverse proxy terminates TLS and routes
      # host/ to this service over the docker network
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

volumes:
  postgres-data:

networks:
  # API, broker, dispatcher and the reverse proxy share this network.
  app:
    name: ${SOULCLOUD_APP_NETWORK:-soulcloudjs_app}
  # Each plugin host gets its own internal network with the dispatcher. Do
  # not attach plugin hosts to `app` or to one another.
  plugin_generic:
    name: ${SOULCLOUD_PLUGIN_GENERIC_NETWORK:-soulcloudjs_plugin_generic}
    internal: true
