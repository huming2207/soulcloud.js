name: soulcloudjs

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: soulcloud
      POSTGRES_USER: soulcloud
      POSTGRES_PASSWORD: soulcloud
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulcloud -d soulcloud"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql
      # fresh volumes also get the isolated test database
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment:
      DATABASE_URL: postgres://soulcloud:soulcloud@postgres:5432/soulcloud
      # shared with the broker; must be set in .env (>= 32 chars)
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      API_BIND_ADDRESS: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: broker
    environment:
      DATABASE_URL: postgres://soulcloud:soulcloud@postgres:5432/soulcloud
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MQTT_BROKER_PORT: 1883
    ports:
      - "1883:1883"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    environment:
      WEB_PORT: 8080
    ports:
      # Bun serves the SPA; TLS + /v1 routing to the api service are
      # handled by the reverse proxy in front (traefik in production)
      - "8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "bun -e \"fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1))\""
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
