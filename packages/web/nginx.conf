# Web console nginx config: serves the built SPA only. No reverse
# proxying here — the API (8080), web (80) and MQTT (1883) ports are
# exposed directly by compose; the reverse proxy in front (traefik in
# the reference deployment) routes /v1 + /health to the api service and
# terminates TLS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # basic hardening headers (TLS and HSTS come from the proxy in front)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # strict CSP: no inline scripts (vite emits only hashed external
    # bundles); emotion/MUI inline styles need 'unsafe-inline' for styles
    # only. The API is same-origin through the proxy (connect-src 'self').
    #
    # Verified: MUI's <InitColorSchemeScript /> emits nothing under pure
    # client rendering (it returns null outside SSR), so script-src 'self'
    # does not block it here. IF the app ever gains SSR, that component
    # WILL inject an inline script - add its sha256 hash to script-src or
    # pass the CSP nonce through its `nonce` prop before shipping.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite emits hashed filenames for assets; safe to cache forever
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # any other file-looking path that does not exist is a real 404
    # (must come after the asset rules; nginx picks the first regex match)
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }
}
